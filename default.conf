server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    location = /tantor2 {
        return 301 /tantor2/;
    }

    location /tantor2/ {
        alias /usr/share/nginx/html/;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
